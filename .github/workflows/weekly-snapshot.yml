name: weekly-snapshot

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch snapshot (top 300 per month)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: python -m whats_hot --windowed --pause 2.5
      - name: Compare with previous snapshot
        env:
          PYTHONPATH: src
        run: |
          mkdir -p reports
          python -m whats_hot.track --out "reports/$(date -u +%F).txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit snapshot and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
